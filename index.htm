<style>
	#paw-container {
		position: fixed;
		top: 0;
		left: 0;
		width: 100vw;
		height: 100vh;
		overflow: hidden;
		pointer-events: none;
	}

	.paw-print {
		position: absolute;
		width: 100px;
		height: 100px;
		transform-origin: center;
		opacity: 0; /* Start invisible */
		transition: opacity 0.5s ease-out;
	}
</style>

<div id="paw-container"></div>

<script>
	// Get root font size in pixels
	const rootFontSize = parseFloat(getComputedStyle(document.documentElement).fontSize); // usually 19px at default

	// Define desired scale relative to 19px baseline
	const baselineFontSize = 19;
	const desiredScaleAtBaseline = 0.3;

	// Calculate scale factor
	const scaleFactor = desiredScaleAtBaseline * (rootFontSize / baselineFontSize);

	// Use scaleFactor as before
	const pawSize = 100 * scaleFactor;
	const stepSpacing = pawSize * 2;

	const fadeDuration = 500;
	const container = document.getElementById('paw-container');

	const svgPaw = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
		<!-- <rect x="50" y="0" width="50" height="100" fill="red" /> -->
		<path style="fill:#E3F5F188;" d="M 66,4 C 53,4 47,32 61,36 81,42 81,6 67,4 Z M 34,6 H 33 C 17,10 21,46 41,38 54,33 46,6 34,6 Z m 55,23 c -5,0 -12,6 -14,11 -4,8 2,23 10,20 12,-4 14,-26 8,-30 -1,-1 -2,-1 -4,-1 z M 10,33 C 9,33 8,33 7,34 -1,40 7,64 17,64 25,64 30,51 26,45 22,39 16,33 10,33 Z M 51,43 C 43,43 34,50 33,56 31,67 25,68 21,70 5,78 15,104 35,94 43,90 53,90 61,94 87,108 95,74 77,66 70,63 67,60 65,54 62,46 57,43 51,43 Z" />
	</svg>`;

	function walkAcross() {
		const margin = 100; // pixels
		const w = window.innerWidth + margin * 2;
		const h = window.innerHeight + margin * 2;
		const offsetX = -margin;
		const offsetY = -margin;

		// Define central box (still based on visible screen)
		const boxX = window.innerWidth * 0.25;
		const boxY = window.innerHeight * 0.25;
		const boxW = window.innerWidth * 0.5;
		const boxH = window.innerHeight * 0.5;

		// Pick a random point inside the central box
		const cx = boxX + Math.random() * boxW;
		const cy = boxY + Math.random() * boxH;

		// Pick a random angle
		const angle = Math.random() * 2 * Math.PI;

		// Cast a long line in both directions
		const length = Math.max(w, h) * 2;
		const x1 = cx + Math.cos(angle) * length;
		const y1 = cy + Math.sin(angle) * length;
		const x2 = cx - Math.cos(angle) * length;
		const y2 = cy - Math.sin(angle) * length;

		// Clip to extended screen bounds
		function clipToScreen(x1, y1, x2, y2, w, h, offsetX, offsetY) {
			const points = [];

			function addIfValid(x, y) {
				if (x >= offsetX && x <= offsetX + w && y >= offsetY && y <= offsetY + h) {
					points.push({ x, y });
				}
			}

			let t;

			t = (offsetX - x1) / (x2 - x1); // left
			addIfValid(offsetX, y1 + t * (y2 - y1));

			t = (offsetX + w - x1) / (x2 - x1); // right
			addIfValid(offsetX + w, y1 + t * (y2 - y1));

			t = (offsetY - y1) / (y2 - y1); // top
			addIfValid(x1 + t * (x2 - x1), offsetY);

			t = (offsetY + h - y1) / (y2 - y1); // bottom
			addIfValid(x1 + t * (x2 - x1), offsetY + h);

			return points;
		}

		const clipped = clipToScreen(x1, y1, x2, y2, w, h, offsetX, offsetY);
		if (clipped.length < 2) return;

		// randomize which point is the start and end
		const [p1, p2] = clipped;
		const flip = Math.random() < 0.5;
		const start = flip ? p1 : p2;
		const end = flip ? p2 : p1;


		const dx = end.x - start.x;
		const dy = end.y - start.y;
		const distance = Math.hypot(dx, dy);
		const steps = Math.ceil(distance / stepSpacing);
		const perpAngle = Math.atan2(dy, dx) + Math.PI / 2;

		for (let i = 0; i < steps; i++) {
			const progress = i / (steps - 1);
			const baseX = start.x + dx * progress;
			const baseY = start.y + dy * progress;

			const offset = (i % 2 === 0 ? 1 : -1) * pawSize * 0.5;
			const x = baseX + Math.cos(perpAngle) * offset;
			const y = baseY + Math.sin(perpAngle) * offset;

			const paw = document.createElement('div');
			paw.className = 'paw-print';
			paw.innerHTML = svgPaw;
			paw.style.left = `${x - pawSize / 2}px`;
			paw.style.top = `${y - pawSize / 2}px`;
			paw.style.transform = `scale(${scaleFactor}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI + 90}deg) ${i % 2 ? 'scaleX(-1)' : ''}`;

			setTimeout(() => {
				container.appendChild(paw);
				paw.style.opacity = 1; // appears quickly due to how the css transition is structured with "ease out"

				setTimeout(() => {
					paw.style.opacity = 0; // Fade out
				}, fadeDuration); // Wait before fading out

				setTimeout(() => {
					paw.remove(); // Remove after fade
				}, fadeDuration * 2);
			}, i * 150);

		}
	}

	walkAcross();
</script>
